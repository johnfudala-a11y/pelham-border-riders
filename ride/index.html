<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pelham Sled Trails</title>
<meta name="description" content="Unofficial GPS trail map for snowmobile trails in Pelham, NH.">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sled Trails">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="map" aria-label="Trail map"></div>

<button id="statusBar" class="status unknown" type="button" aria-label="Trail status">
  <span id="statusDot" class="dot"></span>
  <span id="statusText">Loading trail status…</span>
  <span id="statusAge"></span>
</button>

<div id="alert" role="alert" hidden>
  <strong>OFF TRAIL</strong>
  <span id="alertDist"></span>
  <button id="alertMute" type="button">Silence</button>
</div>

<div id="hud" hidden>
  <div class="hud-cell"><b id="hudSpeed">0</b><small>mph</small></div>
  <div class="hud-cell"><b id="hudTrail">–</b><small id="hudTrailLbl">to trail</small></div>
  <div class="hud-cell"><b id="hudAcc">–</b><small>GPS ± ft</small></div>
  <div class="hud-cell rec-only"><b id="hudDist">0.0</b><small>miles</small></div>
</div>

<nav id="bar">
  <button id="btnLocate" type="button"><span class="ico">◎</span><span class="lbl">Find me</span></button>
  <button id="btnRecord" type="button"><span class="ico">●</span><span class="lbl">Record</span></button>
  <button id="btnSOS" type="button" class="sos"><span class="ico">SOS</span><span class="lbl">Share spot</span></button>
  <button id="btnMenu" type="button"><span class="ico">☰</span><span class="lbl">Menu</span></button>
</nav>

<section id="sheet" hidden aria-modal="true" role="dialog">
  <header>
    <h2 id="sheetTitle"></h2>
    <button id="sheetClose" type="button" aria-label="Close">✕</button>
  </header>
  <div id="sheetBody"></div>
</section>

<div id="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script src="members.js"></script>
</body>
</html>
